<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<title>Shanghai Family Trip · Journey Controller</title>
<style>
:root{--pink:#e84887;--pink-dark:#b92862;--pink-soft:#fff0f6;--ink:#36212b;--muted:#78636c;--line:#f0d5e0;--bg:#fff8fb;--shadow:0 10px 28px rgba(151,42,87,.12);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg)}body{overflow:hidden}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.header{z-index:30;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));background:rgba(255,248,251,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{min-width:0;flex:1}.brand small{display:block;color:var(--pink-dark);font-size:10px;font-weight:900;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand b{display:block;font-size:18px}.emergency{width:44px;height:44px;flex:none;border:1px solid #ffc7d9;border-radius:14px;background:#fff;color:var(--pink-dark);font-size:20px;font-weight:900;box-shadow:var(--shadow)}.frame-wrap{position:relative;min-height:0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}.nav{z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:7px max(6px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));background:rgba(255,255,255,.98);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(105,25,58,.08)}.nav button{min-width:0;min-height:56px;border:0;border-radius:15px;background:transparent;color:var(--muted);display:grid;place-items:center;align-content:center;gap:1px;padding:5px 2px;font:inherit}.nav button i{font-style:normal;font-size:20px}.nav button span{font-size:11px;font-weight:750;white-space:nowrap}.nav button.active{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;box-shadow:0 7px 18px rgba(232,72,135,.25)}.sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(45,18,30,.34);opacity:0;pointer-events:none;transition:.18s}.sheet{position:fixed;left:10px;right:10px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:61;max-width:560px;margin:auto;padding:10px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 60px rgba(70,15,40,.25);transform:translateY(20px);opacity:0;pointer-events:none;transition:.18s}.sheet.open,.sheet-backdrop.open{opacity:1;pointer-events:auto}.sheet.open{transform:none}.sheet-head{padding:7px 8px 10px}.sheet-head b{display:block;font-size:18px}.sheet-head small{color:var(--muted)}.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheet-grid button{min-height:62px;border:1px solid var(--line);border-radius:16px;background:var(--pink-soft);color:var(--ink);font:inherit;text-align:left;padding:10px 12px}.sheet-grid button b,.sheet-grid button small{display:block}.sheet-grid button small{color:var(--muted);margin-top:2px}.version{position:absolute;right:8px;bottom:8px;z-index:3;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.9);font-size:9px;color:var(--muted);pointer-events:none}@media(min-width:900px){.shell{width:min(820px,100%);margin:auto;box-shadow:0 0 0 1px var(--line),0 20px 70px rgba(80,30,50,.12)}body{background:#f6eef1}.sheet{left:50%;right:auto;width:540px;transform:translate(-50%,20px)}.sheet.open{transform:translate(-50%,0)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="header"><div class="brand"><small>SHANGHAI FAMILY TRIP · 13–18 SEP 2026</small><b id="screenTitle">วันนี้</b></div><button class="emergency" id="emergencyBtn" aria-label="ฉุกเฉิน">✚</button></header>
<div class="frame-wrap"><iframe id="legacy" src="../index.html" title="Shanghai Family Trip"></iframe><span class="version">Journey Controller · TH/中文</span></div>
<nav class="nav" aria-label="เมนูหลัก">
<button data-root="home" class="active"><i>⌂</i><span>วันนี้</span></button><button data-root="plan"><i>☷</i><span>แผน</span></button><button data-root="explore"><i>⌖</i><span>สำรวจ</span></button><button data-root="budget"><i>¥</i><span>ค่าใช้จ่าย</span></button><button data-root="more"><i>•••</i><span>เพิ่มเติม</span></button>
</nav>
</div>
<div class="sheet-backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"><div class="sheet-head"><b id="sheetTitle"></b><small id="sheetSubtitle"></small></div><div class="sheet-grid" id="sheetGrid"></div></section>
<script>
(function(){
'use strict';
var frame=document.getElementById('legacy'),title=document.getElementById('screenTitle'),sheet=document.getElementById('sheet'),backdrop=document.getElementById('backdrop'),sheetTitle=document.getElementById('sheetTitle'),sheetSubtitle=document.getElementById('sheetSubtitle'),sheetGrid=document.getElementById('sheetGrid');
var labels={home:'วันนี้',plan:'แผน',explore:'สำรวจ',budget:'ค่าใช้จ่าย',more:'เพิ่มเติม'};
var groups={explore:{title:'สำรวจ',subtitle:'เลือกสิ่งที่อยากหา',items:[['map','◎','แผนที่','ดูจุดทั้งหมดและเส้นทาง'],['places','⌖','สถานที่','ค้นหาไทย / 中文 / English'],['food','🍜','ร้านอาหาร','เลือกร้านตามย่านและประเภท'],['ideas','✦','Plan B','ตัวเลือกเมื่อฝนตก ร้านปิด หรือมีเวลาเพิ่ม']]},more:{title:'เพิ่มเติม',subtitle:'ข้อมูลเตรียมตัวและข้อมูลสำคัญ',items:[['checklist','✓','Checklist','เช็กของและความพร้อม'],['insurance','✚','ประกันเดินทาง','เบอร์ติดต่อและวงเงินสำคัญ'],['trip','ⓘ','ข้อมูลทริป','เที่ยวบิน โรงแรม และสัมภาระ'],['install','＋','ติดตั้งแอป','Add to Home Screen']]}};
function doc(){try{return frame.contentDocument}catch(e){return null}}
function hideLegacyChrome(){var d=doc();if(!d)return;var id='ux-v2-bridge-style';if(d.getElementById(id))return;var st=d.createElement('style');st.id=id;st.textContent='.topbar,.bottom-nav{display:none!important}body{padding-bottom:18px!important}.app-shell{padding-top:14px!important}@media(max-width:540px){.app-shell{padding-left:12px!important;padding-right:12px!important}}';d.head.appendChild(st)}
function oldButton(tab){var d=doc();if(!d)return null;if(tab==='food')return d.querySelector('[data-food-tab]');return d.querySelector('.nav-btn[data-tab="'+tab+'"]')}
function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open')}
function route(tab,root){hideLegacyChrome();var b=oldButton(tab);if(b){b.click();setTimeout(hideLegacyChrome,30)}if(root){document.querySelectorAll('.nav [data-root]').forEach(function(x){x.classList.toggle('active',x.dataset.root===root)});title.textContent=labels[root]||labels.home}closeSheet()}
function openSheet(kind){var g=groups[kind];if(!g)return;sheetTitle.textContent=g.title;sheetSubtitle.textContent=g.subtitle;sheetGrid.innerHTML=g.items.map(function(x){return '<button type="button" data-sub="'+x[0]+'"><b>'+x[1]+' '+x[2]+'</b><small>'+x[3]+'</small></button>'}).join('');sheet.classList.add('open');backdrop.classList.add('open')}
frame.addEventListener('load',function(){hideLegacyChrome();setTimeout(hideLegacyChrome,250)});
document.querySelector('.nav').addEventListener('click',function(e){var b=e.target.closest('[data-root]');if(!b)return;var root=b.dataset.root;if(root==='explore'||root==='more'){document.querySelectorAll('.nav [data-root]').forEach(function(x){x.classList.toggle('active',x===b)});title.textContent=labels[root];openSheet(root);return}route(root,root)});
sheetGrid.addEventListener('click',function(e){var b=e.target.closest('[data-sub]');if(!b)return;var tab=b.dataset.sub;if(tab==='install'){var d=doc(),install=d&&d.getElementById('installHelpBtn');if(install)install.click();closeSheet();return}route(tab,['map','places','food','ideas'].includes(tab)?'explore':'more')});
backdrop.addEventListener('click',closeSheet);document.getElementById('emergencyBtn').addEventListener('click',function(){route('insurance','more')});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
})();
</script>
<script src="readiness.js"></script>
<script src="first-time-china.js"></script>
<script src="journey-controller.js"></script>
<script src="privacy-guard.js"></script>
<script src="simulator-fix.js"></script>
<script src="i18n.js"></script>
<script src="i18n-fix.js"></script>
<script src="mobile-layout-fix.js"></script>
</body>
</html>
