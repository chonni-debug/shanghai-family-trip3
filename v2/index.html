<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Shanghai Family Trip</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/trip-icon.svg">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="private-wallet.css">
<link rel="stylesheet" href="content-library.css">
<link rel="stylesheet" href="photo-integrity.css">
<link rel="stylesheet" href="usability.css">
<link rel="stylesheet" href="production-readiness.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="brand"><small>SHANGHAI FAMILY TRIP · 13–18 SEP 2026</small><b id="screenTitle">วันนี้</b></div>
    <div class="header-actions">
      <button class="header-btn" id="helpBtn" type="button" aria-label="ช่วยฉัน">?</button>
      <button class="lang-btn" id="langBtn" type="button">TH / 中</button>
      <button class="header-btn emergency" id="emergencyBtn" type="button" aria-label="ฉุกเฉิน">✚</button>
    </div>
  </header>
  <main id="app" class="app-main" aria-live="polite"></main>
  <nav id="bottomNav" class="bottom-nav" aria-label="เมนูหลัก">
    <button data-tab="home" class="active"><i>⌂</i><span>วันนี้</span></button>
    <button data-tab="plan"><i>☷</i><span>แผน</span></button>
    <button data-tab="explore"><i>⌖</i><span>สำรวจ</span></button>
    <button data-tab="budget"><i>¥</i><span>ค่าใช้จ่าย</span></button>
    <button data-tab="more"><i>•••</i><span>เพิ่มเติม</span></button>
  </nav>
</div>
<div id="modalBackdrop" class="modal-backdrop" hidden></div>
<section id="modal" class="modal" role="dialog" aria-modal="true" hidden>
  <header><div><h2 id="modalTitle"></h2><p id="modalSub"></p></div><button id="modalClose" class="close-btn" type="button" aria-label="ปิด">×</button></header>
  <div id="modalBody" class="modal-body"></div>
</section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app-core.js"></script>
<script src="app-views-main.js"></script>
<script src="app-views-more.js"></script>
<script src="app-modals.js"></script>
<script src="private-wallet.js"></script>
<script src="content-library.js"></script>
<script src="verified-photo-library.js"></script>
<script src="photo-integrity.js"></script>
<script src="usability.js"></script>
<script src="production-readiness.js"></script>
<script src="wallet-storage-guard.js"></script>
<script src="app-events.js"></script>
</body>
</html>
